<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About | Nicki Fung Acupuncture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #efefef;
      --text: #2f2929;
      --muted: #494242;
      --max-width: 1520px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
    }

    .page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 18px 28px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 54px;
    }

    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 3rem;
      line-height: 1;
      color: var(--text);
      text-decoration: none;
    }

    .nav {
      display: flex;
      gap: 34px;
      align-items: center;
      padding-top: 4px;
    }

    .nav a {
      font-size: 1rem;
      color: var(--text);
      text-decoration: none;
      position: relative;
    }

    .nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 1px;
      background: var(--text);
    }

    .about-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(280px, 360px);
      gap: 70px;
      align-items: start;
      flex: 1;
    }

    .about-copy h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(3.5rem, 6vw, 5.6rem);
      line-height: 0.95;
      font-weight: 500;
      max-width: 780px;
      margin-bottom: 26px;
      letter-spacing: -0.02em;
    }

    .about-copy p {
      font-size: 1.08rem;
      line-height: 1.6;
      color: var(--muted);
      max-width: 1050px;
      margin-bottom: 18px;
    }

    .about-image {
      padding-top: 22px;
      display: flex;
      justify-content: flex-end;
    }

    .about-image img {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
      background: #ddd;
    }

    .contact-row {
      margin-top: 90px;
      padding-top: 20px;
    }

    .contact-row a {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.6rem, 4.2vw, 4.4rem);
      color: var(--text);
      text-decoration: none;
      line-height: 1;
    }

    .contact-row a:hover {
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    @media (max-width: 1100px) {
      .about-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }

      .about-image {
        justify-content: flex-start;
        padding-top: 0;
      }

      .about-image img {
        max-width: 420px;
      }

      .contact-row {
        margin-top: 48px;
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 20px 20px 36px;
      }

      .site-header {
        flex-direction: column;
        gap: 24px;
        margin-bottom: 38px;
      }
